server {

	root /var/www/media;

	# Add index.php to the list if you are using PHP
	index index.html index.htm;

	server_name media.ahiru.pl;

	location / {
		# First attempt to serve request as file, then
		# as directory, then fall back to displaying a 404.
		try_files $uri $uri/ =404;
	}

        location /books {
                proxy_pass http://127.0.0.1:8123/;
        }

	location /radicale/ {
	    proxy_pass           http://localhost:5232/;
	    proxy_set_header     X-Script-Name /radicale;
	    proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header     X-Remote-User $remote_user;
	    proxy_set_header     Host $http_host;
#	    auth_basic           "Radicale - Password Required";
#	    auth_basic_user_file /etc/apache2/.htpasswd; 
	}

	# Music server
        location /music/ {
          allow all;
          index index.php;
          location ~ \.php {
                try_files $uri index.php =404;

                # This line for Debian / Ubuntu
                # fastcgi_pass unix:/run/php/php-fpm.sock;
		fastcgi_pass unix:/run/php/php7.3-fpm.sock;

                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME $request_filename;
                include /etc/nginx/fastcgi_params;
                fastcgi_read_timeout 1800;
          }
          error_page 404 = /rompr/404.php;
          try_files $uri $uri/ =404;
          location ~ /albumart/* {
                  expires -1s;
          }

          auth_basic "Music";
          auth_basic_user_file /etc/apache2/.htpasswd; 
        }

	# pass PHP scripts to FastCGI server
	#
	location ~ \.php$ {
		include snippets/fastcgi-php.conf;
	
		# With php-fpm (or other unix sockets):
		fastcgi_pass unix:/run/php/php7.3-fpm.sock;
		# With php-cgi (or other tcp sockets):
		# fastcgi_pass 127.0.0.1:9000;
	}

	location /torrents {
		# allow 192.168.0.1/24;

		auth_basic "Torrents";
		auth_basic_user_file /etc/apache2/.htpasswd; 
	}

	# deny access to .htaccess files, if Apache's document root
	# concurs with nginx's one
	#
	#location ~ /\.ht {
	#	deny all;
	#}


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/docs.ahiru.pl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/docs.ahiru.pl/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = media.ahiru.pl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot



	server_name media.ahiru.pl;
    listen 80;
    return 404; # managed by Certbot


}
