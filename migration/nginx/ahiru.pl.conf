server {

	root /var/www/ahiru/public;

	# Add index.php to the list if you are using PHP
	index index.html index.htm;

	server_name ahiru.pl;

	error_page 404 /404.html;

	location / {
		# First attempt to serve request as file, then
		# as directory, then fall back to displaying a 404.
		try_files $uri $uri/ =404;
	}

        location /git {
                proxy_pass http://127.0.0.1:3001/;
        }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/docs.ahiru.pl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/docs.ahiru.pl/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = ahiru.pl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


	listen 80;

	server_name ahiru.pl;
    return 404; # managed by Certbot


}
